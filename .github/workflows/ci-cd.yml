name: Vendor Risk Multi-Agent CI/CD & IaC Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-validate:
    name: Pytest Suite, Schema Validation & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full Pytest suite (Unit, Async Memory, OTel & IaC)
        env:
          EXECUTION_MODE: simulation
          OTEL_ENABLED: "true"
        run: |
          pytest -v

  terraform-iac-validate:
    name: Validate Terraform IaC Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format & Validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
