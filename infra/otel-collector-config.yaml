# ============================================================================
# OpenTelemetry Collector Pipeline Configuration
# ============================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 256
  attributes/pii_guard:
    actions:
      - key: service.namespace
        value: third-party-risk-management
        action: upsert

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/pii_guard, batch]
      exporters: [otlp/jaeger, debug]
