# ============================================================================
# Docker Compose IaC — Multi-Agent Service + OpenTelemetry Collector + Jaeger
# ============================================================================

services:
  vendor-risk-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendor-risk-compliance-agent
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - EXECUTION_MODE=${EXECUTION_MODE:-auto}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_FAST_MODEL=${GEMINI_FAST_MODEL:-gemini-2.5-flash}
      - GEMINI_PRO_MODEL=${GEMINI_PRO_MODEL:-gemini-2.5-pro}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_FAST_MODEL=${OPENAI_FAST_MODEL:-gpt-4o-mini}
      - OPENAI_PRO_MODEL=${OPENAI_PRO_MODEL:-gpt-4o}
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=vendor-risk-compliance-multi-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SQLITE_DB_PATH=/var/lib/vendor-sessions/vendor_sessions.db
    volumes:
      - vendor_sessions_data:/var/lib/vendor-sessions
    depends_on:
      - otel-collector
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: vendor-risk-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: vendor-risk-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Distributed Tracing Web UI
    restart: unless-stopped

volumes:
  vendor_sessions_data:
    driver: local
